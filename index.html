<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuizMaster</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --text: #0f172a;
        --muted: #475569;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(90vw, 480px);
        background: var(--card);
        border: 1px solid rgba(79, 70, 229, 0.12);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        padding: 2.25rem 1.75rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 2.5rem);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .launch-button {
        display: inline-block;
        background: var(--primary);
        color: white;
        text-decoration: none;
        font-weight: 700;
        padding: 0.9rem 1.5rem;
        border-radius: 12px;
        transition: 0.2s ease;
      }

      .launch-button:hover {
        background: var(--primary-dark);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>QuizMaster</h1>
      <p>Tap the button below to launch the quiz app when you are ready.</p>
      <a class="launch-button" href="standalone-preview.html">Open QuizMaster</a>
    </main>
  </body>
</html>
